<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.twitch.tv https://player.kick.com; img-src https: data:; connect-src https://raw.githubusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TV de Lives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0c0b;--panel:#151311;--line:#2a2622;--txt:#ebe3d2;--mut:#8c8478;--acc:#ff7a1a;--phos:#8dff9c;--yt:#ff3b3b;--tw:#a970ff;--kk:#53fc18;--bar:52px;--ctl:56px;--gw:340px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Space Mono',ui-monospace,monospace;font-size:13px}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}

/* ===== barra superior: marca + filtros numa linha ===== */
.bar{height:var(--bar);display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--line)}
.brand{font-family:VT323,monospace;font-size:28px;letter-spacing:.04em;white-space:nowrap;line-height:1}
.brand b{font-weight:400;color:var(--acc)}
.filters{display:flex;align-items:center;gap:14px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-shrink:0}
.seg button{padding:5px 10px;color:var(--mut);border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--txt)}
.seg button.on{color:var(--bg);background:var(--txt)}
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.p-yt{background:var(--yt)}.p-tw{background:var(--tw)}.p-kk{background:var(--kk)}
.sel{display:flex;align-items:center;gap:6px;flex-shrink:0;color:var(--mut);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sel select{appearance:none;background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 26px 5px 10px;color:var(--txt);font-size:13px;letter-spacing:0;text-transform:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.sel select:focus{outline:1px solid var(--acc)}
.sel select option{background:var(--panel)}
.search{width:200px;flex-shrink:0;background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--txt)}
.search::placeholder{color:var(--mut)}
.search:focus{outline:1px solid var(--acc)}

/* ===== área principal ===== */
.main{display:flex;height:calc(100vh - var(--bar))}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 24px 0}
/* tela: 16:9 que cabe na altura e na largura disponíveis */
.screen{position:relative;width:min(100%, calc((100vh - var(--bar) - var(--ctl) - 36px) * 16 / 9));aspect-ratio:16/9;background:#000;border-radius:22px/18px;overflow:hidden;
  box-shadow:0 0 0 1px #2e2a26,0 0 0 10px #171513,0 0 0 11px #2e2a26,0 30px 60px #000c}
#player,#player iframe,#ext{position:absolute;inset:0;width:100%;height:100%;border:0}
#ext{display:none;background:#000}
.scan,.vig{position:absolute;inset:0;pointer-events:none;z-index:5}
.scan{background:repeating-linear-gradient(0deg,transparent 0 3px,#00000022 3px 4px)}
.vig{background:radial-gradient(ellipse at center,transparent 65%,#0008 100%);box-shadow:inset 0 0 40px #000a}
.static{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:6;transition:opacity .18s;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");background-color:#666}
.static.on{opacity:1;animation:snow .12s steps(4) infinite}
@keyframes snow{0%{background-position:0 0}25%{background-position:-60px 40px}50%{background-position:30px -70px}75%{background-position:-90px -20px}100%{background-position:50px 60px}}
.screen.boot>#player,.screen.boot>#ext{animation:boot .7s ease-out}
@keyframes boot{0%,40%{transform:scale(1,.004);filter:brightness(5)}75%{transform:scale(1,1);filter:brightness(1.6)}100%{filter:none}}
.osd{position:absolute;top:22px;left:26px;right:26px;display:flex;gap:16px;align-items:flex-start;pointer-events:none;opacity:0;transition:opacity .3s;z-index:7;font-family:VT323,monospace;color:var(--phos);text-shadow:0 0 8px #5dff7a99,2px 2px 0 #000}
.osd.show{opacity:1}
.chnum{font-size:56px;line-height:.8}
.osd b{display:block;font-weight:400;font-size:26px;line-height:1}
.osd span{font-size:19px;line-height:1.1;display:block;max-width:620px}
.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background-size:cover;background-position:center;z-index:2;text-align:center}
.fallback.on{display:flex}
.fallback::before{content:"";position:absolute;inset:0;background:#000d}
.fallback>*{position:relative;max-width:520px;padding:0 20px}
.fallback b{font-family:VT323;font-weight:400;font-size:32px}
.fallback p{color:var(--mut);margin-top:4px}
.btn{display:inline-block;margin-top:8px;color:var(--bg);background:var(--txt);text-decoration:none;padding:8px 16px;border-radius:6px;font-weight:700}
.empty-tv{position:absolute;inset:0;background:#000;z-index:4;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-family:VT323,monospace;font-size:28px;color:var(--phos)}

/* ===== barra de controle mínima ===== */
.ctl{height:var(--ctl);width:min(100%, calc((100vh - var(--bar) - var(--ctl) - 36px) * 16 / 9));display:flex;align-items:center;gap:14px;padding:0 4px}
.chd{font-family:VT323,monospace;font-size:34px;color:var(--phos);text-shadow:0 0 6px #5dff7a88;line-height:1;min-width:52px}
.now{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.now b{color:var(--txt);font-weight:700}
.cbtn{border:1px solid var(--line);border-radius:6px;padding:6px 11px;color:var(--txt);white-space:nowrap}
.cbtn:hover{border-color:var(--mut)}
.cbtn.acc{border-color:var(--acc);color:var(--acc)}
.cbtn.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.ext{color:var(--mut);white-space:nowrap}
.ext:hover{color:var(--txt)}

/* ===== guia lateral (gaveta) ===== */
.guide{width:var(--gw);flex-shrink:0;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:margin-right .25s}
body.noguide .guide{margin-right:calc(-1 * var(--gw))}
.ghead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.ghead .t{font-family:VT323;font-size:22px;letter-spacing:.04em}
.ghead .u{color:var(--mut);font-size:11px}
.active{padding:8px 16px;color:var(--mut);font-size:11.5px;border-bottom:1px solid var(--line)}
.active b{color:var(--txt);font-weight:700}
.clear{color:var(--acc);text-decoration:underline;font-size:11.5px}
.list{overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:#333 transparent}
.item{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:9px 16px;cursor:pointer;border-bottom:1px solid #1d1a17}
.item:hover{background:#181614}
.item.cur{background:#1f1b17;box-shadow:inset 2px 0 0 var(--acc)}
.item .n{font-family:VT323;font-size:22px;color:var(--mut);line-height:1}
.item.cur .n{color:var(--phos)}
.item .t{line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{color:var(--mut);font-size:11.5px;margin-top:3px}
.item .m em{font-style:normal;color:var(--txt)}
.noemb{color:var(--acc)}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}
.gfoot{padding:10px 16px;border-top:1px solid var(--line);color:var(--mut);font-size:11.5px;display:flex;justify-content:space-between;gap:8px}
.gfoot button{color:var(--txt);text-decoration:underline}

@media(max-width:900px){
  .bar{height:auto;flex-wrap:wrap;padding:10px 14px;gap:10px}
  .filters{flex-basis:100%;order:3}
  .search{width:auto;flex:1}
  .main{flex-direction:column;height:auto}
  .stage{padding:12px}
  .screen,.ctl{width:100%}
  .ctl{flex-wrap:wrap;height:auto;padding:10px 0}
  .guide{width:auto;border-left:0;border-top:1px solid var(--line);max-height:70vh}
  body.noguide .guide{margin-right:0;display:none}
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">TV DE <b>LIVES</b></div>
  <nav class="filters" aria-label="Filtros">
    <div class="seg" id="plats" role="group" aria-label="Plataforma"></div>
    <label class="sel">Tema <select id="cats"></select></label>
    <label class="sel">Audiência <select id="sizes"></select></label>
    <label class="sel">Ordem <select id="sorts"></select></label>
  </nav>
  <input class="search" id="q" placeholder="Buscar ou nº do canal" maxlength="80" aria-label="Buscar canal ou título">
</header>

<div class="main">
  <section class="stage">
    <div class="screen boot" id="screen">
      <div id="player"></div>
      <iframe id="ext" title="Player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div class="empty-tv" id="emptyTv" style="display:none"></div>
      <div class="fallback" id="fallback">
        <div><b id="fbTitle"></b><p id="fbMeta"></p></div>
        <div><p>Este canal não libera a live fora da plataforma.</p><a class="btn" id="fbLink" target="_blank" rel="noopener noreferrer">▶ Assistir na plataforma</a></div>
      </div>
      <div class="static" id="static"></div>
      <div class="osd" id="osd"><div class="chnum" id="osdNum">000</div><div><b id="osdCh"></b><span id="osdTitle"></span></div></div>
      <div class="scan"></div><div class="vig"></div>
    </div>
    <div class="ctl">
      <span class="chd" id="chd">---</span>
      <span class="now" id="nowMeta">Sintonizando…</span>
      <button class="cbtn" id="prev" title="Canal anterior (↑)" aria-label="Canal anterior">◀</button>
      <button class="cbtn" id="next" title="Próximo canal (↓)" aria-label="Próximo canal">▶</button>
      <button class="cbtn acc" id="zap" title="Canal aleatório (Z)">ZAPEAR</button>
      <button class="cbtn on" id="guideBtn" title="Mostrar/ocultar o guia (G)">GUIA</button>
      <a class="ext" id="openExt" target="_blank" rel="noopener noreferrer">↗</a>
    </div>
  </section>

  <aside class="guide" id="guide">
    <div class="ghead"><span class="t">GUIA · <span id="count">0</span> CANAIS</span><span class="u" id="updated"></span></div>
    <div class="active" id="active"></div>
    <div class="list" id="list"></div>
    <div class="gfoot"><span>YouTube · Twitch · Kick</span><button id="exportCsv">Catálogo CSV</button></div>
  </aside>
</div>

<script>
'use strict';
// Sem chaves neste arquivo: a coleta roda no GitHub Actions e publica JSON no branch "data".
const DATA = 'https://raw.githubusercontent.com/eduardomontsm/tv-de-lives/data/';
const PLAT = {yt:'YouTube',tw:'Twitch',kk:'Kick'};
const SIZES=[['Todas',0,Infinity],['Até 50',0,51],['50–500',51,501],['500–5 mil',501,5001],['+5 mil',5001,Infinity]];
const SORTS=[['viewers','Mais vistos'],['small','Menores'],['recent','Recentes'],['random','Aleatório']];
const ID_RE={yt:/^[\w-]{11}$/,tw:/^[a-z0-9_]{2,25}$/,kk:/^[a-z0-9_-]{1,40}$/};

let lives=[],updatedAt=0;
let state={plat:'all',cat:'Todas',size:0,sort:'viewers',q:''};
let view=[],cur=-1,player=null,playerReady=false,pending=null;

const $=id=>document.getElementById(id);
const pad3=n=>String(n).padStart(3,'0');
const fmt=n=>n==null||n<0?'—':n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace('.',',')+' mi':n>=1e3?(n>=1e4?Math.round(n/1e3):(n/1e3).toFixed(1).replace('.',','))+' mil':String(n);
const esc=s=>String(s??'').replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
const safeImg=u=>/^https:\/\/([a-z0-9-]+\.)*(ytimg\.com|ggpht\.com|jtvnw\.net|kick\.com)\//i.test(u||'')?u:'';
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'agora':m<60?`há ${m} min`:`há ${Math.round(m/60)} h`};
const watchUrl=l=>l.p==='yt'?`https://www.youtube.com/watch?v=${l.id}`:l.p==='tw'?`https://www.twitch.tv/${l.id}`:`https://kick.com/${l.id}`;

// só aceita registros bem-formados (defesa extra contra dados adulterados)
function clean(arr){return (Array.isArray(arr)?arr:[]).filter(l=>l&&PLAT[l.p]&&ID_RE[l.p].test(String(l.id))).map(l=>({p:l.p,id:String(l.id),ch:String(l.ch||''),chTitle:String(l.chTitle||'').slice(0,100),title:String(l.title||'').slice(0,200),tags:(Array.isArray(l.tags)?l.tags:[]).map(String).slice(0,6),game:String(l.game||'').slice(0,80),viewers:Math.max(0,+l.viewers||0),subs:l.subs==null?null:Math.max(0,+l.subs||0),embed:l.embed!==false,start:String(l.start||''),thumb:safeImg(l.thumb)}))}

async function load(){
  try{const r=await fetch(DATA+'lives.json?t='+Math.floor(Date.now()/6e4),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();lives=clean(j.lives);updatedAt=+j.updatedAt||0}catch(e){}
  build();
}

const tagsOf=l=>l.tags.length?l.tags:['Outros'];
function build(){
  const base=lives.filter(l=>state.plat==='all'||l.p===state.plat);
  const counts={};base.forEach(l=>tagsOf(l).forEach(t=>counts[t]=(counts[t]||0)+1));
  if(state.cat!=='Todas'&&!counts[state.cat])state.cat='Todas';
  const pc={all:lives.length};lives.forEach(l=>pc[l.p]=(pc[l.p]||0)+1);
  $('plats').innerHTML=[['all','Todas'],...Object.entries(PLAT)].map(([k,n])=>`<button class="${k===state.plat?'on':''}" data-p="${k}" title="${pc[k]||0} canais">${k==='all'?'':`<span class="pdot p-${k}"></span>`}${n}</button>`).join('');
  const cats=['Todas',...Object.keys(counts).sort((a,b)=>counts[b]-counts[a])];
  $('cats').innerHTML=cats.map(c=>`<option value="${esc(c)}" ${c===state.cat?'selected':''}>${c==='Todas'?'Todos':esc(c)} (${c==='Todas'?base.length:counts[c]})</option>`).join('');
  $('sizes').innerHTML=SIZES.map((s,i)=>`<option value="${i}" ${i===state.size?'selected':''}>${s[0]}</option>`).join('');
  $('sorts').innerHTML=SORTS.map(([k,n])=>`<option value="${k}" ${k===state.sort?'selected':''}>${n}</option>`).join('');
  $('updated').textContent=updatedAt?`atualizada ${ago(updatedAt)}`:'';
  render();
}
function render(){
  const [sizeName,lo,hi]=SIZES[state.size];const q=state.q.toLowerCase();const playing=view[cur]?view[cur].p+view[cur].id:null;
  view=lives.filter(l=>(state.plat==='all'||l.p===state.plat)&&(state.cat==='Todas'||tagsOf(l).includes(state.cat))&&l.viewers>=lo&&l.viewers<hi&&(!q||/^\d+$/.test(q)||(l.title+' '+l.chTitle+' '+l.game).toLowerCase().includes(q)));
  const s=state.sort;
  if(s==='viewers')view.sort((a,b)=>b.viewers-a.viewers);
  if(s==='small')view.sort((a,b)=>a.viewers-b.viewers);
  if(s==='recent')view.sort((a,b)=>b.start.localeCompare(a.start));
  if(s==='random')for(let i=view.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[view[i],view[j]]=[view[j],view[i]]}
  $('count').textContent=view.length;
  const act=[];if(state.plat!=='all')act.push(`<b>${PLAT[state.plat]}</b>`);if(state.cat!=='Todas')act.push(`<b>${esc(state.cat)}</b>`);if(state.size)act.push(`<b>${sizeName}</b> pessoas`);if(state.q&&!/^\d+$/.test(state.q))act.push(`<b>“${esc(state.q)}”</b>`);
  $('active').innerHTML=act.length?`${act.join(' · ')} · <button class="clear" id="clearF">limpar</button>`:`Lives brasileiras ao vivo agora`;
  $('list').innerHTML=view.length?view.map((l,i)=>`<div class="item ${l.p+l.id===playing?'cur':''}" data-i="${i}">
    <div class="n">${pad3(i+1)}</div>
    <div><div class="t">${esc(l.title)}</div><div class="m"><span class="pdot p-${l.p}"></span><em>${esc(l.chTitle)}</em> · ${fmt(l.viewers)} vendo${l.embed?'':' · <span class="noemb">só na plataforma</span>'}</div></div></div>`).join('')
    :`<div class="empty">${lives.length?'Nenhum canal com esses filtros.':'Carregando programação…'}</div>`;
  cur=playing?view.findIndex(v=>v.p+v.id===playing):-1;
  $('emptyTv').style.display=lives.length?'none':'flex';$('emptyTv').textContent=lives.length?'':'FORA DO AR · VOLTAMOS EM INSTANTES';
}

let osdT;
function osd(num,ch,title){$('osdNum').textContent=num;$('osdCh').textContent=ch;$('osdTitle').textContent=title;$('osd').classList.add('show');clearTimeout(osdT);osdT=setTimeout(()=>$('osd').classList.remove('show'),3200)}
function tune(i){
  if(!view.length)return;cur=(i+view.length)%view.length;const l=view[cur];
  $('static').classList.add('on');setTimeout(()=>$('static').classList.remove('on'),380);
  osd(pad3(cur+1),`${l.chTitle} · ${PLAT[l.p]}`,`${l.title} · ${fmt(l.viewers)} vendo`);
  $('chd').textContent=pad3(cur+1);
  $('nowMeta').innerHTML=`<span class="pdot p-${l.p}"></span><b>${esc(l.chTitle)}</b> · ${esc(l.title)}`;
  $('openExt').href=watchUrl(l);$('openExt').textContent=`${PLAT[l.p]} ↗`;$('openExt').title=`Abrir no ${PLAT[l.p]}`;
  document.querySelectorAll('.item').forEach(e=>e.classList.toggle('cur',+e.dataset.i===cur));
  document.querySelector(`.item[data-i="${cur}"]`)?.scrollIntoView({block:'nearest'});
  $('fallback').classList.remove('on');
  if(!l.embed)return showFallback(l);
  if(l.p==='yt'){
    setExt('');
    if(playerReady)player.loadVideoById(l.id);else pending=l.id;
  }else{
    if(playerReady)player.stopVideo();
    const host=location.hostname||'eduardomontsm.github.io';
    setExt(l.p==='tw'?`https://player.twitch.tv/?channel=${encodeURIComponent(l.id)}&parent=${encodeURIComponent(host)}&autoplay=true`:`https://player.kick.com/${encodeURIComponent(l.id)}?autoplay=true`);
  }
}
function setExt(src){const f=$('ext');if(!src){f.style.display='none';f.removeAttribute('src');return}f.src=src;f.style.display='block'}
function showFallback(l){if(playerReady)player.stopVideo();setExt('');const f=$('fallback');f.classList.add('on');f.style.backgroundImage=l.thumb?`url("${l.thumb.replace(/"/g,'')}")`:'';$('fbTitle').textContent=l.chTitle;$('fbMeta').textContent=l.title;$('fbLink').href=watchUrl(l);$('fbLink').textContent=`▶ Assistir no ${PLAT[l.p]}`}
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{playerVars:{autoplay:1,playsinline:1,rel:0},events:{
  onReady:()=>{playerReady=true;if(pending&&view[cur]?.p==='yt')player.loadVideoById(pending)},
  onError:e=>{const l=view[cur];if(!l||l.p!=='yt')return;if([101,150,153].includes(e.data)){l.embed=false;showFallback(l);render()}else setTimeout(()=>tune(cur+1),800)}}})};

// sintonia direta pelo teclado: digite o número do canal
let typed='',typedT;
function digit(d){typed=(typed+d).slice(-3);osd(typed.padStart(3,'-'),'SINTONIA DIRETA','');clearTimeout(typedT);typedT=setTimeout(commit,1300)}
function commit(){clearTimeout(typedT);if(typed){const n=+typed-1;typed='';if(n>=0&&n<view.length)tune(n);else osd('---','CANAL INEXISTENTE',`Há ${view.length} canais com esses filtros`)}}
const zap=()=>tune(Math.random()*view.length|0);
function toggleGuide(){document.body.classList.toggle('noguide');$('guideBtn').classList.toggle('on',!document.body.classList.contains('noguide'))}

$('plats').onclick=e=>{const b=e.target.closest('[data-p]');if(b){state.plat=b.dataset.p;build()}};
$('cats').onchange=e=>{state.cat=e.target.value;build()};
$('sizes').onchange=e=>{state.size=+e.target.value;build()};
$('sorts').onchange=e=>{state.sort=e.target.value;build()};
$('active').onclick=e=>{if(e.target.id==='clearF'){state={...state,plat:'all',cat:'Todas',size:0,q:''};$('q').value='';build()}};
$('q').oninput=e=>{state.q=e.target.value.trim();render()};
$('q').onkeydown=e=>{if(e.key==='Enter'&&/^\d+$/.test(state.q)){const n=+state.q-1;e.target.value='';state.q='';render();tune(n)}};
$('list').onclick=e=>{const it=e.target.closest('.item');if(it)tune(+it.dataset.i)};
$('prev').onclick=()=>tune(cur-1);$('next').onclick=()=>tune(cur+1);$('zap').onclick=zap;$('guideBtn').onclick=toggleGuide;
$('exportCsv').onclick=async()=>{
  let ch={};try{const r=await fetch(DATA+'catalog.json?t='+Date.now(),{cache:'no-store'});ch=(await r.json()).channels||{}}catch(e){}
  const url=c=>c.p==='yt'?'https://www.youtube.com/channel/'+c.id:c.p==='tw'?'https://www.twitch.tv/'+c.id:'https://kick.com/'+c.id;
  // prefixo ' evita fórmulas maliciosas ao abrir no Excel/Sheets
  const cell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return `"${s.replace(/"/g,'""')}"`};
  const rows=[['plataforma','id','nome','inscritos','pico_de_audiencia','temas','vezes_visto_ao_vivo','url']].concat(Object.values(ch).map(c=>[PLAT[c.p]||c.p,c.id,c.name,c.subs??'',c.peak||'',(c.tags||[]).join(' | '),c.seen||0,url(c)]));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.map(cell).join(',')).join('\n')],{type:'text/csv'}));a.download='catalogo-tv-de-lives.csv';a.click();
};
document.addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;
  if(e.key==='ArrowUp'){e.preventDefault();tune(cur-1)}if(e.key==='ArrowDown'){e.preventDefault();tune(cur+1)}
  if(e.key==='z')zap();if(e.key==='g')toggleGuide();
  if(/^\d$/.test(e.key))digit(e.key);if(e.key==='Enter'&&typed)commit()});
let ty=null;const scr=$('screen');
scr.addEventListener('touchstart',e=>ty=e.touches[0].clientY,{passive:true});
scr.addEventListener('touchend',e=>{if(ty==null)return;const d=e.changedTouches[0].clientY-ty;if(Math.abs(d)>60)tune(cur+(d<0?1:-1));ty=null});
setTimeout(()=>scr.classList.remove('boot'),900);
if(innerWidth<1180)toggleGuide();   // telas menores começam com o guia fechado

// limpa dados antigos do protótipo (chave/token) que possam ter ficado neste navegador
try{Object.keys(localStorage).filter(k=>k.startsWith('tvl_')).forEach(k=>localStorage.removeItem(k))}catch(e){}
load().then(()=>{if(view.length)tune(0)});
setInterval(load,5*60e3);
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
